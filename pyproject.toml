[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-forge"
version = "0.5.0"
description = "Windows CLI + OpenAI-compatible API for local uncensored multimodal models"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2",
  "huggingface_hub>=0.23",
  "pillow>=10",
  "numpy>=1.26",
  "openvino>=2026.4.0,<2027",
  "openvino-genai>=2026.4.0,<2027",
  "openvino-tokenizers>=2026.4.0,<2027",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10"]
litert = ["litert-lm>=0.18"]

[project.scripts]
lforge = "local_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
